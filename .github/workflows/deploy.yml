name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── 1. Go unit tests ────────────────────────────────────────────────
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./...
      - run: go test ./...

  # ── 2. Godot web export → GitHub Pages ──────────────────────────────
  build-web:
    name: Godot web export → GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Ensure export directory exists
        run: mkdir -p deploy/web client/pwa

      - name: Install Godot 4.4
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          sudo mv Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install web export templates (fetch only web slice)
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          python3 - << 'PY'
          import urllib.request, zipfile, io, os
          URL = "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          class RF(io.RawIOBase):
              def __init__(self, url):
                  self.url = url; self.pos = 0
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"Range":"bytes=0-0"})) as r:
                      self.size = int(r.headers["Content-Range"].split("/")[1])
              def seekable(self): return True
              def readable(self): return True
              def tell(self): return self.pos
              def seek(self, o, w=0):
                  self.pos = o if w==0 else self.pos+o if w==1 else self.size+o; return self.pos
              def read(self, n=-1):
                  if n<0: n=self.size-self.pos
                  if n==0 or self.pos>=self.size: return b""
                  end=min(self.pos+n,self.size)-1
                  with urllib.request.urlopen(urllib.request.Request(self.url,headers={"Range":f"bytes={self.pos}-{end}"})) as r: data=r.read()
                  self.pos+=len(data); return data
              def readinto(self, b):
                  d=self.read(len(b)); b[:len(d)]=d; return len(d)
          out=os.path.expanduser("~/.local/share/godot/export_templates/4.4.stable")
          zf=zipfile.ZipFile(io.BufferedReader(RF(URL),1<<20))
          for n in ["templates/version.txt","templates/web_nothreads_release.zip","templates/web_nothreads_debug.zip"]:
              open(os.path.join(out,os.path.basename(n)),"wb").write(zf.read(n)); print("extracted",n)
          PY

      - name: Generate PWA icons
        run: |
          pip install pillow -q
          python3 - << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import glob, os
          S=1024; img=Image.new("RGBA",(S,S),(0,0,0,0)); d=ImageDraw.Draw(img)
          for y in range(S):
              t=y/S; d.line([(0,y),(S,y)],fill=(int(75-54*t),int(35-27*t),int(149-98*t),255))
          mask=Image.new("L",(S,S),0); ImageDraw.Draw(mask).rounded_rectangle([0,0,S,S],radius=int(S*.22),fill=255)
          bg=Image.new("RGBA",(S,S),(0,0,0,0)); bg.paste(img,(0,0),mask); img=bg; d=ImageDraw.Draw(img)
          cx=cy=S//2; R=int(S*.33)
          d.ellipse([cx-R,cy-R,cx+R,cy+R],fill=(217,141,16,255),outline=(255,243,176,255),width=int(S*.025))
          r2=int(R*.78); d.ellipse([cx-r2,cy-r2,cx+r2,cy+r2],fill=(255,207,74,255),outline=(168,106,8,255),width=int(S*.02))
          fonts=glob.glob("/usr/share/fonts/**/DejaVuSerif-Bold.ttf",recursive=True) or glob.glob("/usr/share/fonts/**/*Bold*.ttf",recursive=True)
          f=ImageFont.truetype(fonts[0],int(S*.42)); d.text((cx,cy+S*.01),"7",font=f,fill=(122,42,12,255),anchor="mm")
          os.makedirs("client/pwa",exist_ok=True)
          for s in (144,180,512): img.resize((s,s),Image.LANCZOS).save(f"client/pwa/icon{s}.png"); print(f"icon{s}.png")
          PY

      - name: Godot import + web export
        run: bash scripts/build_web.sh

      - name: Inject server URL
        env:
          SERVER_URL: ${{ secrets.SLOTS_SERVER_URL }}
        run: |
          SERVER="${SERVER_URL:-}"
          if [ -n "$SERVER" ]; then
            # Escape for sed: replace literal $SERVER_URL placeholder
            python3 -c "
import sys, os
html = open('deploy/web/index.html').read()
html = html.replace('\$SERVER_URL', os.environ.get('SERVER_URL',''))
open('deploy/web/index.html','w').write(html)
print('Injected server URL')
"
          else
            python3 -c "
html = open('deploy/web/index.html').read()
html = html.replace('\$SERVER_URL', '')
open('deploy/web/index.html','w').write(html)
print('No SERVER_URL — client uses mock/same-origin fallback')
"
          fi

      - name: Finalize deploy folder
        run: |
          cp client/pwa/icon*.png deploy/web/ 2>/dev/null || true
          touch deploy/web/.nojekyll
          ls -la deploy/web/

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: deploy/web/
          retention-days: 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy/web
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"

  # ── 3. Docker image (non-blocking — needs registry secret to push) ──
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: build-web
    # Don't fail the whole pipeline if Docker registry isn't configured yet
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: deploy/web/

      - name: Build Docker image
        run: docker build -t fortune-reels:${{ github.sha }} .

      - name: Smoke-test the image
        run: |
          docker run -d --name test -p 8080:8080 \
            -e AUTH_SECRET=ci-test-secret-32chars-minimum0 \
            fortune-reels:${{ github.sha }}
          sleep 3
          curl -sf http://localhost:8080/v1/healthz && echo "healthz OK"
          docker rm -f test

      # Uncomment and add DOCKER_USERNAME / DOCKER_TOKEN secrets to push:
      # - name: Push to Docker Hub
      #   run: |
      #     echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      #     docker tag fortune-reels:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fortune-reels:latest
      #     docker push ${{ secrets.DOCKER_USERNAME }}/fortune-reels:latest
