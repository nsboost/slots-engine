app = "fortune-reels"
primary_region = "ord"

[build]

[env]
  LISTEN_ADDR = ":8080"
  STATIC_DIR  = "/app/web"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
